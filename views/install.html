<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#667eea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Grandma Scrabble">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon.svg">
  <title>Grandma Scrabble</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-align: center;
      padding: 24px;
    }

    .container { max-width: 520px; width: 100%; }

    .game-icon {
      font-size: 5rem;
      margin-bottom: 1rem;
      display: block;
    }

    .title {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.25);
      margin-bottom: 0.5rem;
    }

    .greeting {
      font-size: 1.25rem;
      opacity: 0.9;
      margin-bottom: 2.5rem;
    }

    #install-btn {
      display: none;
      width: 100%;
      padding: 28px 32px;
      font-size: 1.9rem;
      font-weight: 800;
      background: white;
      color: #5a3d8a;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 10px 40px rgba(0,0,0,0.35);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      line-height: 1.2;
      letter-spacing: -0.3px;
    }

    #install-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 48px rgba(0,0,0,0.4);
    }

    #install-btn:active {
      transform: scale(0.97);
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    }

    .waiting-msg {
      font-size: 1rem;
      opacity: 0.75;
      margin-top: 1.5rem;
    }

    #installed-msg { display: none; }

    .check-icon {
      font-size: 4rem;
      display: block;
      margin-bottom: 1rem;
    }

    .installed-title {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
    }

    .installed-sub { font-size: 1.1rem; opacity: 0.85; }
  </style>
</head>
<body>
  <div class="container">
    <span class="game-icon">🎲</span>
    <h1 class="title">Grandma Scrabble</h1>
    <p class="greeting">Hi {{NAME}}! Tap the button below to install.</p>
    <button id="install-btn">📲 Install App</button>
    <p class="waiting-msg" id="waiting-msg">Loading install prompt…</p>
    <div id="installed-msg">
      <span class="check-icon">✅</span>
      <p class="installed-title">App installed!</p>
      <p class="installed-sub">Open it from your home screen to play.</p>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }

    const btn = document.getElementById('install-btn');
    const waitingMsg = document.getElementById('waiting-msg');
    const installedMsg = document.getElementById('installed-msg');
    let deferredPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      btn.style.display = 'block';
      waitingMsg.style.display = 'none';
    });

    btn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      deferredPrompt = null;
      if (outcome === 'accepted') {
        btn.style.display = 'none';
        installedMsg.style.display = 'block';
      }
    });

    window.addEventListener('appinstalled', () => {
      deferredPrompt = null;
      btn.style.display = 'none';
      waitingMsg.style.display = 'none';
      installedMsg.style.display = 'block';
    });
  </script>
</body>
</html>
